<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108">
  <!-- white rounded tile with a thin border (matches the launcher: white bg,
       black gem) — the border keeps it visible on a white README page -->
  <rect x="1.5" y="1.5" width="105" height="105" rx="22" ry="22"
        fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <!-- large black brilliant-cut gem -->
  <path fill="#000000" d="M28,32 L80,32 L54,84 Z"/>
  <!-- white facet lines -->
  <path stroke="#FFFFFF" stroke-width="2.5" fill="none" d="M36.7,50 L71.3,50"/>
  <path stroke="#FFFFFF" stroke-width="2.5" fill="none" d="M45.3,32 L54,84"/>
  <path stroke="#FFFFFF" stroke-width="2.5" fill="none" d="M62.7,32 L54,84"/>
</svg>
